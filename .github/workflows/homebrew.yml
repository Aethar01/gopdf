name: Update Homebrew cask

# homebrew-tap bumps its onon cask to the latest release whenever it receives
# an onon-release dispatch, and checks hourly in case one is missed.
on:
  # A tag's release only exists once the Release workflow has finished.
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - name: Send homebrew-tap an onon-release dispatch
        env:
          # A fine-grained token with Contents read and write on homebrew-tap.
          GH_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
        run: gh api repos/Aethar01/homebrew-tap/dispatches -f event_type=onon-release
