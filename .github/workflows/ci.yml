name: CI

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - README.md
      - .github/workflows/release.yml
  pull_request:
    paths-ignore:
      - README.md
  workflow_dispatch:

jobs:
  linux:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: pacman -Syu --noconfirm git go pkgconf sdl3 libmupdf gtk3

      - name: Verify native dependencies
        run: pkg-config --cflags --libs mupdf sdl3

      - name: Test
        run: go test ./...

      - name: Check generated documentation
        run: go run ./cmd/builddocs -check

      - name: Build
        run: go build ./...

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: brew install sdl3 mupdf go

      - name: Set up environment
        run: |
          MUPDF_PREFIX="$(brew --prefix mupdf)"
          SDL3_PREFIX="$(brew --prefix sdl3)"

          echo "CGO_CFLAGS=-I${MUPDF_PREFIX}/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L${MUPDF_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=${SDL3_PREFIX}/lib:${MUPDF_PREFIX}/lib:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Verify native dependencies
        run: |
          test -f "$(brew --prefix mupdf)/include/mupdf/fitz.h"
          test -f "$(brew --prefix mupdf)/lib/libmupdf.dylib"
          test -f "$(brew --prefix sdl3)/lib/libSDL3.dylib"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-mupdf

      - name: Verify native dependencies
        run: pkg-config --cflags --libs mupdf sdl3

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
