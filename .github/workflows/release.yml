name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  macos:
    name: Build macOS ${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goarch: amd64
          - runner: macos-latest
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: brew install sdl3 mupdf go dylibbundler

      - name: Set up environment
        run: |
          MUPDF_PREFIX="$(brew --prefix mupdf)"
          echo "CGO_CFLAGS=-I${MUPDF_PREFIX}/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L${MUPDF_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=${MUPDF_PREFIX}/lib:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Verify native dependencies
        run: |
          test -f "$(brew --prefix mupdf)/include/mupdf/fitz.h"
          test -f "$(brew --prefix mupdf)/lib/libmupdf.dylib"
          test -f "$(brew --prefix sdl3)/lib/libSDL3.dylib"

      - name: Build
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X onon/internal/config.Version=${VERSION}" -o dist/onon .

      - name: Package
        run: |
          name="onon-${VERSION}-darwin-${{ matrix.goarch }}"
          version="${VERSION#v}"
          app="onon.app"

          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$app/Contents/Frameworks"
          cp dist/onon "$app/Contents/MacOS/onon"

          sed -e "s/@VERSION@/${version}/" -e "s/@BUILD@/${GITHUB_RUN_NUMBER}/" \
            assets/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"

          cp assets/macos/onon.icns "$app/Contents/Resources/onon.icns"
          # macOS 26 and later take the adaptive icon from Assets.car, which
          # assets/icon/build.sh compiles from onon.icon; older macOS uses onon.icns.
          cp assets/macos/Assets.car "$app/Contents/Resources/Assets.car"

          dylibbundler -od -b -x "$app/Contents/MacOS/onon" -d "$app/Contents/Frameworks" -p "@executable_path/../Frameworks"
          cp "$(brew --prefix sdl3)/lib/libSDL3.dylib" "$app/Contents/Frameworks/libSDL3.dylib"
          install_name_tool -id "@executable_path/../Frameworks/libSDL3.dylib" "$app/Contents/Frameworks/libSDL3.dylib"
          codesign --force --sign - "$app/Contents/Frameworks/libSDL3.dylib"
          # SDL is dlopen()ed by bare name, which dyld resolves through the
          # executable's rpaths.
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$app/Contents/MacOS/onon"
          codesign --force --sign - "$app/Contents/MacOS/onon"
          test -f "$app/Contents/Frameworks/libSDL3.dylib"
          if otool -L "$app/Contents/MacOS/onon" "$app"/Contents/Frameworks/*.dylib | grep -E '(/opt/homebrew|/usr/local)/'; then
            exit 1
          fi
          env -u DYLD_LIBRARY_PATH "$app/Contents/MacOS/onon" -v
          codesign --force --deep --sign - "$app"

          mkdir -p "${name}.dmgroot"
          cp -R "$app" "${name}.dmgroot/"
          ln -s /Applications "${name}.dmgroot/Applications"
          hdiutil create -volname "onon" -srcfolder "${name}.dmgroot" -ov -format UDZO "${name}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onon-${{ github.ref_name }}-darwin-${{ matrix.goarch }}
          path: onon-${{ github.ref_name }}-darwin-${{ matrix.goarch }}.dmg
          if-no-files-found: error

  windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-mupdf

      - name: Verify native dependencies
        run: pkg-config --cflags --libs mupdf sdl3

      - name: Compile Windows resources
        run: |
          version="${VERSION#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*)
              version_commas="$(printf '%s' "$version" | awk -F. '{ printf "%d,%d,%d,0", $1, $2, $3 }')"
              ;;
            *)
              version="0.0.0"
              version_commas="0,0,0,0"
              ;;
          esac

          cat > onon.rc <<EOF
          #include <winver.h>

          IDI_ICON1 ICON "assets/onon.ico"
          1 RT_MANIFEST "assets/windows/onon.exe.manifest"

          VS_VERSION_INFO VERSIONINFO
          FILEVERSION ${version_commas}
          PRODUCTVERSION ${version_commas}
          FILEFLAGSMASK 0x3fL
          FILEFLAGS 0x0L
          FILEOS 0x40004L
          FILETYPE 0x1L
          FILESUBTYPE 0x0L
          BEGIN
            BLOCK "StringFileInfo"
            BEGIN
              BLOCK "040904b0"
              BEGIN
                VALUE "CompanyName", "onon\\0"
                VALUE "FileDescription", "onon Document Viewer\\0"
                VALUE "FileVersion", "${version}\\0"
                VALUE "InternalName", "onon\\0"
                VALUE "OriginalFilename", "onon.exe\\0"
                VALUE "ProductName", "onon\\0"
                VALUE "ProductVersion", "${version}\\0"
              END
            END
            BLOCK "VarFileInfo"
            BEGIN
              VALUE "Translation", 0x409, 1200
            END
          END
          EOF

          windres -O coff -o rsrc_windows_amd64.syso onon.rc

      - name: Build
        env:
          CGO_ENABLED: 1
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H=windowsgui -X onon/internal/config.Version=${VERSION}" -o dist/onon.exe .

      - name: Package
        run: |
          name="onon-${VERSION}-windows-amd64"
          mkdir -p "$name"
          cp dist/onon.exe "$name/"
          ldd dist/onon.exe \
            | awk '/\/ucrt64\/bin\// { print $3 }' \
            | sort -u \
            | xargs -r cp -t "$name/"
          cp /ucrt64/bin/SDL3.dll "$name/"
          rm -rf dist/onon-package
          cp -R "$name" dist/onon-package
          powershell -NoProfile -Command "\$env:PATH='${PWD}/${name};C:/msys64/ucrt64/bin;C:/msys64/usr/bin;' + \$env:PATH; \$p = Start-Process -FilePath '${PWD}/${name}/onon.exe' -ArgumentList '-v' -Wait -PassThru; exit \$p.ExitCode"
          powershell -NoProfile -Command "Compress-Archive -Path '${name}' -DestinationPath '${name}.zip'"

      - name: Build installer
        shell: pwsh
        env:
          ONON_VERSION: ${{ github.ref_name }}
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" assets\windows\onon.iss

      - name: Collect Windows release files
        shell: pwsh
        run: |
          Copy-Item `
            "dist/installer/onon-${{ github.ref_name }}-windows-amd64-installer.exe" `
            "onon-${{ github.ref_name }}-windows-amd64-installer.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onon-${{ github.ref_name }}-windows-amd64
          path: |
            onon-${{ github.ref_name }}-windows-amd64.zip
            onon-${{ github.ref_name }}-windows-amd64-installer.exe
          if-no-files-found: error

  linux-appimage:
    name: Build Linux AppImage x86_64
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: pacman -Syu --noconfirm ca-certificates desktop-file-utils fuse2 git go gtk3 libmupdf patchelf pkgconf sdl3 wget

      - name: Verify native dependencies
        run: pkg-config --cflags --libs mupdf sdl3

      - name: Build
        env:
          CGO_ENABLED: 1
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X onon/internal/config.Version=${VERSION}" -o dist/onon .
          dist/onon -v

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
          NO_STRIP: 1
          LDAI_OUTPUT: onon-${{ github.ref_name }}-linux-x86_64.AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/onon AppDir/usr/bin/onon
          cp onon.desktop AppDir/usr/share/applications/onon.desktop
          cp assets/onon.svg AppDir/usr/share/icons/hicolor/scalable/apps/onon.svg
          cp assets/onon.png AppDir/usr/share/icons/hicolor/256x256/apps/onon.png

          wget -O linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/onon.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/onon.svg \
            --executable AppDir/usr/bin/onon \
            --output appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onon-${{ github.ref_name }}-linux-x86_64
          path: onon-${{ github.ref_name }}-linux-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - macos
      - windows
      - linux-appimage
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/onon-* --title "$VERSION" --generate-notes

