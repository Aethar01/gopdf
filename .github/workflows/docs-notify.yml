name: Notify website

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
    steps:
      - name: Trigger ononreader.com rebuild
        if: env.SITE_DEPLOY_HOOK != ''
        run: curl --fail-with-body --request POST "${SITE_DEPLOY_HOOK}"
